[build]
  command = "npm run build"
  publish = "dist"

[[redirects]]
  from = "/socket.io/*"
  to = "http://65.0.38.101:3001/socket.io/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/api/*"
  to = "http://65.0.38.101:3001/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
