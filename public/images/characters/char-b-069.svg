  <!-- Character Banner Plate -->
  <rect x="15" y="145" width="170" height="40" rx="8" fill="#09090b" fill-opacity="0.92" stroke="#15803D" stroke-width="1.5" />

  <!-- Character Name -->
  <text x="100" y="165" font-family="Arial Black, Impact, sans-serif" font-weight="900" font-size="12" fill="#FFFFFF" text-anchor="middle" letter-spacing="0.5">
    Mantis (Martial ...
  </text>
  <text x="100" y="178" font-family="Arial, sans-serif" font-weight="800" font-size="9" fill="#FFFFFF" text-anchor="middle" letter-spacing="1">
    ★ B GRADE ★
  </text>
</svg>